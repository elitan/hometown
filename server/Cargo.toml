[package]
name = "server"
version = "0.1.0"
edition = "2024"
publish = false

# The binary is the whole app: HTTP, jobs, cron, migrations.
[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
northstack = { path = "../crates/northstack" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "chrono", "uuid", "json", "migrate", "macros", "tls-rustls-ring-webpki", "bigdecimal"] }
ts-rs = { version = "12", features = ["chrono-impl", "uuid-impl", "serde-json-impl", "bigdecimal-impl"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
rust-embed = "8"
tracing = "0.1"
bigdecimal = { version = "0.4", features = ["serde"] }
flate2 = "1.1.11"
laz = "0.13.0"
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
