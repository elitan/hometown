# `docker compose up --build` runs the whole app on http://localhost:3000: one binary, with its
# SQLite database in the `data` volume. Lantmäteriet login (optional) is read from LM_USER / LM_PASS in .env.
services:
  app:
    build: .
    environment:
      LM_USER: ${LM_USER:-}
      LM_PASS: ${LM_PASS:-}
      RUST_LOG: info
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
